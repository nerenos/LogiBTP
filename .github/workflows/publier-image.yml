# Publication de l'image de l'API LogiBTP (Dockerfile racine) sur le registre GitHub (GHCR) et sur Docker Hub à chaque
# tag de version « v<majeur>.<mineur>.<correctif> » (ex. v1.0.0). Procédure : documentation/PUBLICATION.md.
# Secrets du dépôt requis : LOGIBTP_CLE_CONSTRUCTION (clé de construction de la distribution, chiffrement du .env ;
# passée en secret BuildKit, jamais dans une couche de l'image), DOCKERHUB_UTILISATEUR et DOCKERHUB_JETON (jeton
# d'accès Docker Hub en lecture-écriture). Variable facultative DOCKERHUB_IMAGE (défaut <utilisateur>/logibtp, dépôt Docker Hub existant).
name: Publier l'image

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de version déjà poussé à publier (ex. v1.0.0)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/logibtp-api

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Contrôler la version (tag = version.txt = package.json)
        id: version
        env:
          CLE: ${{ secrets.LOGIBTP_CLE_CONSTRUCTION }}
          HUB_UTILISATEUR: ${{ secrets.DOCKERHUB_UTILISATEUR }}
          HUB_JETON: ${{ secrets.DOCKERHUB_JETON }}
          HUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          produit="$(grep -v '^#' db/installation/version.txt | sed '/^\s*$/d' | head -n 1 | tr -d '[:space:]')"
          paquet="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $tag : attendu v<majeur>.<mineur>.<correctif>"; exit 1; }
          [[ "$produit" == "$version" ]] || { echo "::error::db/installation/version.txt = $produit, tag = $version"; exit 1; }
          [[ "$paquet" == "$version" ]] || { echo "::error::package.json = $paquet, tag = $version"; exit 1; }
          [[ -n "$CLE" ]] || { echo "::error::Secret LOGIBTP_CLE_CONSTRUCTION absent du dépôt"; exit 1; }
          [[ -n "$HUB_UTILISATEUR" && -n "$HUB_JETON" ]] || { echo "::error::Secrets DOCKERHUB_UTILISATEUR et DOCKERHUB_JETON absents du dépôt"; exit 1; }
          hub="${HUB_IMAGE:-$HUB_UTILISATEUR/logibtp}"
          echo "hub=docker.io/${hub,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mineure=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "majeure=${version%%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_UTILISATEUR }}
          password: ${{ secrets.DOCKERHUB_JETON }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          secrets: |
            cle_construction=${{ secrets.LOGIBTP_CLE_CONSTRUCTION }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.mineure }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.majeure }}
            ${{ env.IMAGE }}:latest
            ${{ steps.version.outputs.hub }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.hub }}:${{ steps.version.outputs.mineure }}
            ${{ steps.version.outputs.hub }}:${{ steps.version.outputs.majeure }}
            ${{ steps.version.outputs.hub }}:latest
          labels: |
            org.opencontainers.image.title=LogiBTP API
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          {
            echo "### Image publiée"
            echo ""
            echo "- \`${IMAGE}:${{ steps.version.outputs.version }}\`"
            echo "- \`${{ steps.version.outputs.hub }}:${{ steps.version.outputs.version }}\`"
            echo ""
            echo "Étiquettes : \`${{ steps.version.outputs.version }}\` (aussi \`${{ steps.version.outputs.mineure }}\`, \`${{ steps.version.outputs.majeure }}\`, \`latest\`)"
            echo ""
            echo "Installation : \`--image ${IMAGE}:${{ steps.version.outputs.version }}\` (Debian) ou \`-Image ${IMAGE}:${{ steps.version.outputs.version }}\` (Windows), après \`docker login\` du registre si l'image est privée."
          } >> "$GITHUB_STEP_SUMMARY"
