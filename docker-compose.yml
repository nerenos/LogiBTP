services:
  postgres:
    image: postgres:17
    container_name: logibtp-postgres
    environment:
      POSTGRES_DB: logibtp
      POSTGRES_USER: logibtp
      POSTGRES_PASSWORD: logibtp
    ports:
      - "5433:5432"
    volumes:
      - logibtp-data:/var/lib/postgresql/data
      # Base de développement : à la première initialisation du volume, db/installation/initialiser-developpement.sh
      # applique les scripts du manifeste db/installation/scripts.txt (ordre unique, démonstration comprise) à la base
      # logibtp puis à logibtp_demo (société « demo », sous-domaine demo.localhost). Dépôt monté en lecture seule.
      - ./db:/logibtp/db:ro
      - ./modules:/logibtp/modules:ro
      - ./db/installation/initialiser-developpement.sh:/docker-entrypoint-initdb.d/000_initialiser.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logibtp -d logibtp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  logibtp-data:
