services:
  postgres:
    image: postgres:17
    container_name: logibtp-postgres
    environment:
      POSTGRES_DB: logibtp
      POSTGRES_USER: logibtp
      POSTGRES_PASSWORD: logibtp
    ports:
      - "5433:5432"
    volumes:
      - logibtp-data:/var/lib/postgresql/data
      # Scripts exécutés dans l'ordre alphabétique à la première initialisation du volume :
      # modules (010 Document, 020 Métré, 030 Liste, 040 Fiche, 050 GED, 060 Bibliothèque, 070 Annuaire) puis cœur BTP (100 et suivants).
      - ./modules/document/db/010_document_schema.sql:/docker-entrypoint-initdb.d/010_document_schema.sql:ro
      - ./modules/document/db/011_document_reference.sql:/docker-entrypoint-initdb.d/011_document_reference.sql:ro
      - ./modules/document/db/012_document_verrou.sql:/docker-entrypoint-initdb.d/012_document_verrou.sql:ro
      - ./modules/document/db/013_document_affichage.sql:/docker-entrypoint-initdb.d/013_document_affichage.sql:ro
      - ./modules/document/db/014_document_frais_annexes.sql:/docker-entrypoint-initdb.d/014_document_frais_annexes.sql:ro
      - ./modules/metre/db/020_metre_schema.sql:/docker-entrypoint-initdb.d/020_metre_schema.sql:ro
      - ./modules/metre/db/021_metre_script.sql:/docker-entrypoint-initdb.d/021_metre_script.sql:ro
      - ./modules/liste/db/030_liste_schema.sql:/docker-entrypoint-initdb.d/030_liste_schema.sql:ro
      - ./modules/liste/db/031_liste_themes.sql:/docker-entrypoint-initdb.d/031_liste_themes.sql:ro
      - ./modules/liste/db/032_liste_saisie.sql:/docker-entrypoint-initdb.d/032_liste_saisie.sql:ro
      - ./modules/fiche/db/040_fiche_schema.sql:/docker-entrypoint-initdb.d/040_fiche_schema.sql:ro
      - ./modules/ged/db/050_ged_schema.sql:/docker-entrypoint-initdb.d/050_ged_schema.sql:ro
      - ./modules/ged/db/051_ged_organisation.sql:/docker-entrypoint-initdb.d/051_ged_organisation.sql:ro
      - ./modules/bibliotheque/db/060_bibliotheque_schema.sql:/docker-entrypoint-initdb.d/060_bibliotheque_schema.sql:ro
      - ./modules/bibliotheque/db/061_bibliotheque_technique.sql:/docker-entrypoint-initdb.d/061_bibliotheque_technique.sql:ro
      - ./modules/bibliotheque/db/062_bibliotheque_coefficients.sql:/docker-entrypoint-initdb.d/062_bibliotheque_coefficients.sql:ro
      - ./modules/annuaire/db/070_annuaire_schema.sql:/docker-entrypoint-initdb.d/070_annuaire_schema.sql:ro
      - ./db/100_btp.sql:/docker-entrypoint-initdb.d/100_btp.sql:ro
      - ./db/110_reference.sql:/docker-entrypoint-initdb.d/110_reference.sql:ro
      - ./db/115_bibliotheque.sql:/docker-entrypoint-initdb.d/115_bibliotheque.sql:ro
      - ./db/116_bibliotheque_demo.sql:/docker-entrypoint-initdb.d/116_bibliotheque_demo.sql:ro
      - ./db/120_listes.sql:/docker-entrypoint-initdb.d/120_listes.sql:ro
      - ./db/121_listes_parametrage.sql:/docker-entrypoint-initdb.d/121_listes_parametrage.sql:ro
      - ./db/130_fiches.sql:/docker-entrypoint-initdb.d/130_fiches.sql:ro
      - ./db/131_fiches_parametrage.sql:/docker-entrypoint-initdb.d/131_fiches_parametrage.sql:ro
      - ./db/140_annuaire.sql:/docker-entrypoint-initdb.d/140_annuaire.sql:ro
      - ./db/141_annuaire_demo.sql:/docker-entrypoint-initdb.d/141_annuaire_demo.sql:ro
      - ./db/142_annuaire_salaries.sql:/docker-entrypoint-initdb.d/142_annuaire_salaries.sql:ro
      - ./db/150_documents_vues.sql:/docker-entrypoint-initdb.d/150_documents_vues.sql:ro
      - ./db/160_structure.sql:/docker-entrypoint-initdb.d/160_structure.sql:ro
      - ./db/161_structure_demo.sql:/docker-entrypoint-initdb.d/161_structure_demo.sql:ro
      - ./db/162_intervenants.sql:/docker-entrypoint-initdb.d/162_intervenants.sql:ro
      - ./db/163_intervenants_demo.sql:/docker-entrypoint-initdb.d/163_intervenants_demo.sql:ro
      - ./db/165_lignes_techniques.sql:/docker-entrypoint-initdb.d/165_lignes_techniques.sql:ro
      - ./db/166_lignes_comptes.sql:/docker-entrypoint-initdb.d/166_lignes_comptes.sql:ro
      - ./db/167_ventilation_frais.sql:/docker-entrypoint-initdb.d/167_ventilation_frais.sql:ro
      # Base de la société « demo » (sous-domaine demo.localhost), créée avec les mêmes scripts.
      - ./db/900_societe_demo.sh:/docker-entrypoint-initdb.d/900_societe_demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logibtp -d logibtp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  logibtp-data:
