<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!-- Fond Carré Arrondi (Regroupement) -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#E0E7FF" />

  <!-- ENGIN (Arrière-plan, orienté vers la droite) -->
  <!-- Cabine -->
  <rect x="52" y="24" width="22" height="22" rx="4" fill="#6366F1" />
  <rect x="60" y="28" width="10" height="12" rx="2" fill="#FFFFFF" />
  <!-- Corps du tracteur -->
  <rect x="46" y="42" width="38" height="20" rx="4" fill="#6366F1" />
  <!-- Roues de l'engin -->
  <circle cx="54" cy="64" r="10" fill="#6366F1" />
  <circle cx="54" cy="64" r="4" fill="#FFFFFF" />
  <circle cx="78" cy="64" r="10" fill="#6366F1" />
  <circle cx="78" cy="64" r="4" fill="#FFFFFF" />
  <!-- Bras / Godet avant -->
  <path d="M84 48L92 48L90 64H82" stroke="#6366F1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- SALARIÉ (Premier plan, à gauche) -->
  <!-- L'épaisseur du trait (stroke) blanc permet de masquer l'engin derrière lui -->
  <circle cx="34" cy="38" r="11" fill="#6366F1" stroke="#FFFFFF" stroke-width="4" />
  <path d="M16 74C16 60 24 52 34 52C44 52 52 60 52 74C52 77 49.5 79 46.5 79H21.5C18.5 79 16 77 16 74Z" fill="#6366F1" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
</svg>